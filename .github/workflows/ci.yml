name: Product Search CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser evaluation
        run: python mlflow_tracking/track_parser.py

      - name: Run retrieval evaluation
        run: python mlflow_tracking/track_retrieval.py

      - name: Run ranking evaluation
        run: python mlflow_tracking/track_ranking.py

      - name: Build Streamlit Docker image
        run: docker build -t product-search-ranking-system .